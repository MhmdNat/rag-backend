[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2.0.0",                         # 1. FORCE NUMPY 1.X FOR PYTORCH
    "click>=8.4.1",
    "chromadb>=0.6.3",
    "deepeval>=2.9.3",
    "dotenv>=0.9.9",
    "ipykernel>=7.2.0",
    "ipython>=9.14.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.2",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langchain-weaviate>=0.0.6",
    "notebook>=7.5.6",
    "ollama>=0.6.2",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.13.0",
    "unstructured[pdf]>=0.22.31",
    "weaviate-client>=4.21.2",
    "fastapi>=0.136.3",
    "langsmith>=0.8.8",
    "uvicorn>=0.49.0",
    "pymysql>=1.2.0",
    "transformers>=4.40.0",               # 2. UPGRADE TO COMPLY WITH TOKENIZERS
    "torch>=2.4.0,<2.5.0",  
    "torchvision>=0.19.0,<0.20.0",  
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.uv]
override-dependencies = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "opencv-python==4.10.0.84",           # 3. FORCE OLD OPENCV THAT USES NUMPY 1.X
]